<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="productTable">
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
        </tr>
        </thead>
        <tbody id="product-table">
        <tr th:each="product : ${products}">
            <td th:text="${product.id}">1</td>
            <td><strong th:text="${product.title}">Product Title</strong></td>
        </tr>
        </tbody>
    </table>
</th:block>

<th:block th:fragment="productRow">
    <tr>
        <td th:text="${product.id}">1</td>
        <td><strong th:text="${product.title}">Product Title</strong></td>
    </tr>
</th:block>

</body>
</html>
