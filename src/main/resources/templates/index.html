<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Product Manager</title>

    <!-- Web Awesome -->
    <link rel="stylesheet" href="https://early.webawesome.com/webawesome@3.0.0-beta.4/dist/styles/webawesome.css"/>
    <script type="module" src="https://early.webawesome.com/webawesome@3.0.0-beta.4/dist/webawesome.loader.js"></script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.0/dist/htmx.min.js"></script>

    <style>
        :root {
          --app-bg: var(--wa-color-gray-50);
          --app-text: var(--wa-color-gray-900);
          --spacing-lg: var(--wa-spacing-6);
          --spacing-md: var(--wa-spacing-4);
          --border: 1px solid var(--wa-color-gray-200);
        }

        body {
          background: var(--app-bg);
          color: var(--app-text);
          font-family: var(--wa-font-body);
          padding: var(--spacing-lg);
          margin: 0;
        }

        .container {
          max-width: 800px;
          margin: 0 auto;
        }

        table {
          width: 100%;
          border-collapse: collapse;
          margin-top: var(--spacing-md);
        }

        th {
          background-color: var(--wa-color-primary-100);
          color: var(--wa-color-primary-900);
          font-weight: var(--wa-font-weight-semibold);
          padding: var(--wa-spacing-3);
          text-align: left;
          border-bottom: var(--border);
        }

        td {
          padding: var(--wa-spacing-3);
          border-bottom: var(--border);
        }
    </style>
</head>
<body>

<div class="container">

    <wa-card heading="Product List">

        <!-- Load Products Button -->
        <wa-button
                variant="primary"
                size="large"
                hx-get="/products"
                hx-target="#product-table-container"
                hx-swap="innerHTML"
        >
            <span class="wa-left">
            <wa-icon name="download"></wa-icon>
            </span>
            Load Products
        </wa-button>

        <!-- Add Product Form -->
        <div style="margin-top: var(--spacing-lg);">
            <h3>Add New Product</h3>
            <form hx-post="/products"
                  hx-target="#product-table-container tbody"
                  hx-swap="beforeend"
                  style="display: grid; gap: var(--wa-spacing-3); max-width: 400px;">

                <wa-form-field label="Title">
                    <wa-input type="text" name="title" required="true"></wa-input>
                </wa-form-field>

                <wa-button type="submit" variant="success" size="medium">
          <span class="wa-left">
            <wa-icon name="plus"></wa-icon>
          </span>
                    Add Product
                </wa-button>
            </form>
        </div>

        <!-- Table Container -->
        <div id="product-table-container" style="margin-top: var(--spacing-lg);">
            <p style="color: var(--wa-color-gray-500);">
                Click "Load Products" to display data.
            </p>
        </div>

    </wa-card>
</div>

<!-- Product fragments: hidden on full page, rendered for HTMX requests -->
<!-- Fragments moved to table.html to avoid full page render issues -->

</body>
</html>
