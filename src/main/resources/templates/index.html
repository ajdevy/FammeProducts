<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Product Manager</title>

    <!-- Web Awesome -->
    <link rel="stylesheet" href="https://early.webawesome.com/webawesome@3.0.0-beta.4/dist/styles/webawesome.css"/>
    <script type="module" src="https://early.webawesome.com/webawesome@3.0.0-beta.4/dist/webawesome.loader.js"></script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.0/dist/htmx.min.js"></script>

    <style>
        :root {
          --app-bg: var(--wa-color-gray-50);
          --app-text: var(--wa-color-gray-900);
          --spacing-lg: var(--wa-spacing-6);
          --spacing-md: var(--wa-spacing-4);
          --border: 1px solid var(--wa-color-gray-200);
        }

        body {
          background: var(--app-bg);
          color: var(--app-text);
          font-family: var(--wa-font-body);
          padding: var(--spacing-lg);
          margin: 0;
          min-height: 100vh;
        }

        .container {
          width: 100%;
          max-width: 100%;
          margin: 0;
          padding: 0;
        }

        .center-content {
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
          gap: 15px;
        }

        .product-form {
          display: grid;
          gap: 15px;
          width: 100%;
          max-width: 400px;
          align-items: center;      /* vertical alignment of items in each row */
          justify-items: center;    /* horizontal centering of items in each column */
          margin: 0 auto;           /* center form within its container */
        }

        .form-section {
          align-self: center;       /* center the section in the stack */
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          width: 100%;
        }

        /* Do not stretch input; keep a readable minimum width */
        .product-form wa-form-field {
          width: auto;
          justify-self: center;
        }

        .product-form wa-input {
          width: auto;
          min-width: 300px;
          justify-self: center;
        }

        .table-container {
          width: 100%;
        }

        /* Make the card fill the screen */
        wa-card {
          width: calc(100% - 30px);
          min-height: calc(100vh - 30px);
          height: auto;
          box-sizing: border-box;
          display: block;
          margin: 15px;
        }

        .stack {
          display: flex;
          flex-direction: column;
          gap: 15px;
          width: 100%;
        }

        /* Ensure gaps control vertical spacing */
        .stack > * { margin: 0; }
        .product-form > * { margin: 0; }

        table {
          width: 100%;
          border-collapse: collapse;
          margin-top: var(--spacing-md);
          margin-left: auto;
          margin-right: auto;
        }

        th {
          background-color: var(--wa-color-primary-100);
          color: var(--wa-color-primary-900);
          font-weight: var(--wa-font-weight-semibold);
          padding: var(--wa-spacing-3);
          text-align: left;
          border-bottom: var(--border);
        }

        td {
          padding: var(--wa-spacing-3);
          border-bottom: var(--border);
        }

        /* Do not stretch buttons; size to content */
        .stack > wa-button {
          width: auto;
          align-self: center;
        }

        .product-form wa-button {
          width: auto;
          align-self: center;
          justify-self: center;
          display: inline-flex;
        }
    </style>
</head>
<body>

<div class="container center-content">

    <wa-card heading="Product List" appearance="outlined">

        <div class="stack">
            <!-- Load Products Button -->
            <wa-button
                    variant="primary"
                    size="large"
                    hx-get="/products"
                    hx-target="#product-table-container"
                    hx-swap="innerHTML"
            >
                <span slot="start">
                    <wa-icon name="download"></wa-icon>
                </span>
                Load Products
            </wa-button>

            <!-- Add Product Form -->
            <div class="form-section">
                <h3>Add New Product</h3>
                <form hx-post="/products"
                      hx-target="#product-table-container tbody"
                      hx-swap="afterbegin"
                      class="product-form">

                    <wa-form-field label="Title">
                        <wa-input type="text" name="title" required="true"></wa-input>
                    </wa-form-field>

                    <wa-button type="submit" variant="success" size="medium">
                        <span slot="start">
                            <wa-icon name="plus"></wa-icon>
                        </span>
                        Add Product
                    </wa-button>
                </form>
            </div>

            <!-- Table Container -->
            <div id="product-table-container" class="table-container">
            </div>
        </div>

    </wa-card>
</div>

<!-- Product fragments: hidden on full page, rendered for HTMX requests -->
<!-- Fragments moved to table.html to avoid full page render issues -->

</body>
</html>
