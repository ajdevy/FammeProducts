<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Test Page</title>

    <!-- Web Awesome Components -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/@web-awesome/components@latest/dist/web-awesome/web-awesome.esm.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@web-awesome/styles@latest/web-awesome.min.css" />

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.0/dist/htmx.min.js"></script>

    <style>
        :root {
          --app-bg: var(--wa-color-gray-50);
          --app-text: var(--wa-color-gray-900);
          --spacing-lg: var(--wa-spacing-6);
          --spacing-md: var(--wa-spacing-4);
          --border: 1px solid var(--wa-color-gray-200);
        }

        body {
          background: var(--app-bg);
          color: var(--app-text);
          font-family: var(--wa-font-body);
          padding: var(--spacing-lg);
          margin: 0;
        }

        .container {
          max-width: 800px;
          margin: 0 auto;
        }

        table {
          width: 100%;
          border-collapse: collapse;
          margin-top: var(--spacing-md);
        }

        th {
          background-color: var(--wa-color-primary-100);
          color: var(--wa-color-primary-900);
          font-weight: var(--wa-font-weight-semibold);
          padding: var(--wa-spacing-3);
          text-align: left;
          border-bottom: var(--border);
        }

        td {
          padding: var(--wa-spacing-3);
          border-bottom: var(--border);
        }
    </style>
</head>
<body>

<div class="container">

    <wa-card heading="Test Product List">

        <!-- Load Button (HTMX-ready for future use) -->
        <wa-button
                variant="primary"
                size="large"
                hx-get="@{/products}"
                hx-target="#product-table"
                hx-swap="innerHTML"
        >
      <span class="wa-left">
        <wa-icon name="download"></wa-icon>
      </span>
            Load Real Products
        </wa-button>

        <!-- Product Table -->
        <div style="margin-top: var(--spacing-lg);">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                </tr>
                </thead>
                <tbody id="product-table">
                <tr th:each="product : ${products}">
                    <td th:text="${product.id}">1</td>
                    <td><strong th:text="${product.title}">Product Title</strong></td>
                </tr>
                </tbody>
            </table>
        </div>

    </wa-card>
</div>

</body>
</html>
